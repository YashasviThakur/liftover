# Local sandbox: self-hosted Flagsmith (target) + Unleash (a source to migrate from).
# Flagsmith services follow Flagsmith's own docker-compose.yml, minus experimentation.
name: liftover

x-flagsmith-env: &flagsmith-env
  DATABASE_URL: postgresql://postgres:password@flagsmith-db:5432/flagsmith
  USE_POSTGRES_FOR_ANALYTICS: 'true'
  ENVIRONMENT: production
  DJANGO_ALLOWED_HOSTS: '*'
  FLAGSMITH_DOMAIN: localhost:8000
  DJANGO_SECRET_KEY: sandbox-only-secret
  TASK_RUN_METHOD: TASK_PROCESSOR

services:
  flagsmith-db:
    image: postgres:15.5-alpine
    environment:
      POSTGRES_PASSWORD: password
      POSTGRES_DB: flagsmith
    volumes: [flagsmith-pg:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -d flagsmith -U postgres']
      interval: 2s
      retries: 30

  flagsmith-migrate:
    image: docker.flagsmith.com/flagsmith/flagsmith:2.295.2
    command: [migrate]
    environment: *flagsmith-env
    depends_on:
      flagsmith-db: {condition: service_healthy}

  flagsmith:
    image: docker.flagsmith.com/flagsmith/flagsmith:2.295.2
    command: [serve]
    environment: *flagsmith-env
    ports: ['8000:8000']
    depends_on:
      flagsmith-migrate: {condition: service_completed_successfully}

  flagsmith-tasks:
    image: docker.flagsmith.com/flagsmith/flagsmith:2.295.2
    command: [run-task-processor]
    environment: *flagsmith-env
    depends_on:
      flagsmith-migrate: {condition: service_completed_successfully}

  unleash-db:
    image: postgres:15.5-alpine
    environment:
      POSTGRES_PASSWORD: password
      POSTGRES_DB: unleash
    volumes: [unleash-pg:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -d unleash -U postgres']
      interval: 2s
      retries: 30

  unleash:
    image: unleashorg/unleash-server:8.3.1
    ports: ['4242:4242']
    environment:
      DATABASE_URL: postgres://postgres:password@unleash-db:5432/unleash
      DATABASE_SSL: 'false'
      # Sandbox-only tokens so scripts can talk to Unleash without clicking through the UI.
      INIT_ADMIN_API_TOKENS: '*:*.liftover-sandbox-admin'
      INIT_BACKEND_API_TOKENS: 'default:development.liftover-sandbox-client'
    depends_on:
      unleash-db: {condition: service_healthy}

volumes:
  flagsmith-pg:
  unleash-pg:
